<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTH PLANWERK - Portal</title>
    <style>
        :root {
            --bth-blue-dark: #050b14;
            --bth-cyan: #38bdf8;
            --bth-blue-primary: #0284c7;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bth-blue-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--text-main);
        }

        /* 1. OBEN: SLOGAN */
        .top-banner {
            position: absolute;
            top: 30px;
            text-align: center;
            z-index: 10;
            animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .top-banner h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 30%, var(--bth-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .top-banner p {
            font-size: 0.85rem;
            color: var(--bth-cyan);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.8;
        }

        /* 2. ZENTRUM: BILD */
        .hero-center {
            position: relative;
            width: 700px;
            height: 700px;
            max-width: 80vh;
            max-height: 80vh;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 120px rgba(2, 132, 199, 0.5), 0 0 45px rgba(56, 189, 248, 0.3);
            overflow: hidden;
            background: #000;
            animation: zoomIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* 3. LOGIN-BUTTON (VERZÖGERT) */
        .btn-left {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            padding: 28px 16px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 5px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            z-index: 20;
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: #000;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            animation: fadeInLeft 0.8s ease forwards 2s;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-left:hover {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.9);
            transform: translateY(-50%) scale(1.08) !important;
        }

        /* MODAL / POPUP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 11, 20, 0.88);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .portal-card {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            padding: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .portal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* 3 TABS BENUTZERÜBERSICHT */
        .portal-tabs {
            display: flex;
            background: #050b14;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 22px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--bth-blue-primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .portal-view {
            display: none;
        }

        .portal-view.active {
            display: block;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* PREMIUM LOGO GRID */
        .partner-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .partner-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 85px;
            padding: 12px;
            background: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .partner-card img {
            max-height: 45px;
            max-width: 90%;
            object-fit: contain;
        }

        .partner-card span {
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
        }

        .partner-card:hover {
            border-color: rgba(56, 189, 248, 0.6);
            background: rgba(2, 132, 199, 0.08);
        }

        .partner-card.active {
            border-color: var(--bth-cyan);
            background: rgba(2, 132, 199, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* FORMULAR FELDER */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        input:focus, textarea:focus {
            border-color: var(--bth-cyan);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--bth-blue-primary);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        /* BEWERBUNGS-BOX DESIGN */
        .partner-info-box {
            background: rgba(2, 132, 199, 0.1);
            border-left: 3px solid var(--bth-cyan);
            padding: 12px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        /* ANIMATIONEN */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateY(-50%) translateX(-40px); }
            to { opacity: 1; transform: translateY(-50%) translateX(0); }
        }
    </style>
</head>
<body>

    <!-- OBEN: SLOGAN -->
    <div class="top-banner">
        <h1>BTH PLANWERK</h1>
        <p>Professionelle Bewässerungsplanung & Hydraulik</p>
    </div>

    <!-- VERZÖGERTER LOGIN-BUTTON -->
    <button class="btn-left" onclick="toggleModal(true)">LOGIN</button>

    <!-- ZENTRALES HAUPTBILD -->
    <div class="hero-center">
        <img src="./BTH.png" alt="BTH PLANWERK" class="hero-img">
    </div>

    <!-- POPUP OVERLAY MODAL -->
    <div id="login-modal" class="modal-overlay">
        <div class="portal-card">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            
            <!-- DIE 3 REITER -->
            <div class="portal-tabs">
                <button id="tab-client" class="tab-btn active" onclick="switchTab('client')">Kunden-Zugang</button>
                <button id="tab-partner" class="tab-btn" onclick="switchTab('partner')">Partner werden 🤝</button>
                <button id="tab-staff" class="tab-btn" onclick="switchTab('staff')">Mitarbeiter-Login</button>
            </div>

            <!-- 1. KUNDEN ZUGANG (LOGO-GRID) -->
            <div id="view-client" class="portal-view active">
                <p class="instruction">Wählen Sie Ihren ausführenden Fachbetrieb:</p>
                
                <div class="partner-grid">
                    <!-- Partner 1 (BTH Hamburg) -->
                    <div class="partner-card active" onclick="selectPartner(this, 'bth')">
                        <!-- Du kannst hier später ein Bild eintragen z.B. <img src="logo-bth.png" alt="BTH"> -->
                        <span>🌊 BTH Hamburg</span>
                    </div>

                    <!-- Partner 2 (Gartenfit) -->
                    <div class="partner-card" onclick="selectPartner(this, 'gartenfit')">
                        <!-- <img src="logo-gartenfit.png" alt="Gartenfit"> -->
                        <span>🌱 M. Berger </span>
                    </div>
                </div>

                <input type="hidden" id="selected-partner" value="bth">

                <div class="form-group">
                    <label>Ihr persönlicher Planungscode</label>
                    <input type="text" id="client-code" placeholder="z. B. BTH-8942-X" style="text-transform: uppercase;">
                </div>

                <button class="btn-primary" onclick="startClientSession()">Planung freischalten ➔</button>
            </div>

            <!-- 2. NEU: BEWERBUNG ALS LIZENZPARTNER -->
            <div id="view-partner" class="portal-view">
                <div class="partner-info-box">
                    <strong>Handverlesene Partnerschaften:</strong><br>
                    Wir vergeben pro Region nur eine exklusive Lizenz für unser Planungs- & Hydrauliksystem.
                </div>

                <div class="form-group">
                    <label>Firmenname / Garten- & Landschaftsbau</label>
                    <input type="text" id="apply-company" placeholder="z. B. Galabau Muster GmbH">
                </div>

                <div class="form-group">
                    <label>Ansprechpartner & E-Mail</label>
                    <input type="email" id="apply-email" placeholder="name@firma.de">
                </div>

                <button class="btn-primary" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);" onclick="submitApplication()">
                    Als Lizenzpartner bewerben ✉️
                </button>
            </div>

            <!-- 3. MITARBEITER LOGIN -->
            <div id="view-staff" class="portal-view">
                <p class="instruction">Interner Zugang für Profi-Planer:</p>

                <div class="form-group">
                    <label>Benutzername / E-Mail</label>
                    <input type="text" id="staff-user" placeholder="mitarbeiter@bth.de">
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="staff-pass" placeholder="••••••••">
                </div>

                <button class="btn-primary" onclick="startStaffSession()">Profi-CAD Öffnen 🔐</button>
            </div>

        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('login-modal');
            if (show) {
                modal.classList.add('open');
            } else {
                modal.classList.remove('open');
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.portal-view').forEach(view => view.classList.remove('active'));

            if (type === 'client') {
                document.getElementById('tab-client').classList.add('active');
                document.getElementById('view-client').classList.add('active');
            } else if (type === 'partner') {
                document.getElementById('tab-partner').classList.add('active');
                document.getElementById('view-partner').classList.add('active');
            } else {
                document.getElementById('tab-staff').classList.add('active');
                document.getElementById('view-staff').classList.add('active');
            }
        }

        function selectPartner(cardElement, partnerId) {
            document.querySelectorAll('.partner-card').forEach(card => card.classList.remove('active'));
            cardElement.classList.add('active');
            document.getElementById('selected-partner').value = partnerId;
        }

        function startClientSession() {
            const partner = document.getElementById('selected-partner').value;
            const code = document.getElementById('client-code').value;
            window.location.href = `editor.html?mode=client&partner=${partner}&code=${code}`;
        }

        function startStaffSession() {
            window.location.href = `editor.html?mode=pro`;
        }

        function submitApplication() {
            const company = document.getElementById('apply-company').value;
            if(!company) {
                alert("Bitte geben Sie Ihren Firmennamen an.");
                return;
            }
            alert("Vielen Dank für Ihr Interesse! Wir prüfen die Verfügbarkeit in Ihrer Region und melden uns umgehend.");
            toggleModal(false);
        }
    </script>
</body>
</html>
