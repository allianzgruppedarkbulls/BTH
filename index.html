<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTH PLANWERK - Portal</title>
    <style>
        :root {
            --bth-blue-dark: #050b14;
            --bth-cyan: #38bdf8;
            --bth-blue-primary: #0284c7;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bth-blue-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--text-main);
        }

        /* 1. OBEN: COOLLER SLOGAN / SCHRIFTZUG (Kommt zuerst von oben) */
        .top-banner {
            position: absolute;
            top: 40px;
            text-align: center;
            z-index: 10;
            animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .top-banner h1 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 30%, var(--bth-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        .top-banner p {
            font-size: 0.85rem;
            color: var(--bth-cyan);
            letter-spacing: 3px;
            margin-top: 6px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.8;
        }

        /* 2. ZENTRUM: DEUTLICH GRÖSSERES RUNDES HAUPTLOGO */
        .hero-center {
            position: relative;
            width: 720px; /* Nochmals deutlich vergrößert */
            height: 720px;
            max-width: 82vh;
            max-height: 82vh;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 120px rgba(2, 132, 199, 0.5), 0 0 45px rgba(56, 189, 248, 0.3);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            background: #000;
            animation: zoomIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero-center:hover {
            transform: scale(1.02);
            box-shadow: 0 0 140px rgba(2, 132, 199, 0.65), 0 0 55px rgba(56, 189, 248, 0.4);
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* 3. LINKER LOGIN-BUTTON (Blendet sich nach 2 Sekunden verzögert ein) */
        .btn-left {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            padding: 28px 16px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 5px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            z-index: 20;
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: #000;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            opacity: 0; /* Startet unsichtbar */
            animation: fadeInLeft 0.8s ease forwards 2s; /* 2 Sekunden Delay! */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-left:hover {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.9);
            transform: translateY(-50%) scale(1.08) !important;
        }

        /* POPUP MODAL (LOGIN FORMULAR) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 11, 20, 0.88);
            backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .portal-card {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .portal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* TABS KUNDE / MITARBEITER */
        .portal-tabs {
            display: flex;
            background: #050b14;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--bth-blue-primary);
            color: #fff;
        }

        .portal-view {
            display: none;
        }

        .portal-view.active {
            display: block;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .partner-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .partner-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
        }

        .partner-card.active {
            border-color: var(--bth-cyan);
            background: rgba(2, 132, 199, 0.15);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--bth-cyan);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--bth-blue-primary);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* KEYFRAME ANIMATIONEN */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }
    </style>
</head>
<body>

    <!-- 1. OBEN EINLAUFENDER SCHRIFTZUG -->
    <div class="top-banner">
        <h1>BTH PLANWERK</h1>
        <p>Professionelle Bewässerungsplanung & Hydraulik</p>
    </div>

    <!-- 2. NACH 2 SEKUNDEN EINBLENDENDER LOGIN-BUTTON (LINKS) -->
    <button class="btn-left" onclick="toggleModal(true)">LOGIN</button>

    <!-- 3. GROSSES RUNDES HAUPTMOTIV (ZENTRUM) -->
    <div class="hero-center">
        <img src="./BTH.png" alt="BTH PLANWERK" class="hero-img">
    </div>

    <!-- POPUP OVERLAY FÜR DEN LOGIN -->
    <div id="login-modal" class="modal-overlay">
        <div class="portal-card">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            
            <div class="portal-tabs">
                <button id="tab-client" class="tab-btn active" onclick="switchTab('client')">Kunden-Zugang</button>
                <button id="tab-staff" class="tab-btn" onclick="switchTab('staff')">Mitarbeiter-Login</button>
            </div>

            <!-- KUNDEN ZUGANG -->
            <div id="view-client" class="portal-view active">
                <p class="instruction">Wählen Sie Ihren Partnerbetrieb:</p>
                
                <div class="partner-grid">
                    <div class="partner-card active" onclick="selectPartner(this, 'bth')">
                        <span>🌊</span>
                        <div>
                            <strong>BTH Hamburg</strong>
                        </div>
                    </div>

                    <div class="partner-card" onclick="selectPartner(this, 'gartenfit')">
                        <span>🌱</span>
                        <div>
                            <strong>Firma Gartenfit</strong>
                        </div>
                    </div>
                </div>

                <input type="hidden" id="selected-partner" value="bth">

                <div class="form-group">
                    <label>Ihr persönlicher Planungscode</label>
                    <input type="text" id="client-code" placeholder="z. B. BTH-8942-X" style="text-transform: uppercase;">
                </div>

                <button class="btn-primary" onclick="startClientSession()">Planung freischalten ➔</button>
            </div>

            <!-- MITARBEITER LOGIN -->
            <div id="view-staff" class="portal-view">
                <p class="instruction">Interner Zugang für Profi-Planung:</p>

                <div class="form-group">
                    <label>Benutzername / E-Mail</label>
                    <input type="text" id="staff-user" placeholder="mitarbeiter@bth.de">
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="staff-pass" placeholder="••••••••">
                </div>

                <button class="btn-primary" onclick="startStaffSession()">Profi-CAD Öffnen 🔐</button>
            </div>

        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('login-modal');
            if (show) {
                modal.classList.add('open');
            } else {
                modal.classList.remove('open');
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.portal-view').forEach(view => view.classList.remove('active'));

            if (type === 'client') {
                document.getElementById('tab-client').classList.add('active');
                document.getElementById('view-client').classList.add('active');
            } else {
                document.getElementById('tab-staff').classList.add('active');
                document.getElementById('view-staff').classList.add('active');
            }
        }

        function selectPartner(cardElement, partnerId) {
            document.querySelectorAll('.partner-card').forEach(card => card.classList.remove('active'));
            cardElement.classList.add('active');
            document.getElementById('selected-partner').value = partnerId;
        }

        function startClientSession() {
            const partner = document.getElementById('selected-partner').value;
            const code = document.getElementById('client-code').value;
            window.location.href = `editor.html?mode=client&partner=${partner}&code=${code}`;
        }

        function startStaffSession() {
            window.location.href = `editor.html?mode=pro`;
        }
    </script>
</body>
</html>
