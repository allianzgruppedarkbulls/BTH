<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTH PLANWERK - Portal</title>
    <style>
        :root {
            --bth-blue-dark: #050b14;
            --bth-cyan: #38bdf8;
            --bth-blue-primary: #0284c7;
            --bth-blue-hover: #0369a1;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bth-blue-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--text-main);
        }

        /* 1. ZENTRALES MOTIV / LOGO MIT GLOW-EFFEKT */
        .hero-center {
            position: relative;
            max-width: 650px;
            width: 85%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            /* Der blaue Neon-Glow um das Bild rum */
            box-shadow: 0 0 80px rgba(2, 132, 199, 0.4), 0 0 30px rgba(56, 189, 248, 0.2);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-center:hover {
            transform: scale(1.01);
            box-shadow: 0 0 100px rgba(2, 132, 199, 0.55), 0 0 40px rgba(56, 189, 248, 0.3);
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .hero-fallback {
            font-size: 3rem;
            font-weight: 900;
            color: var(--bth-cyan);
            letter-spacing: 4px;
            text-align: center;
        }

        /* 2. SEITLICHE BUTTONS (SEITENLEISTEN) */
        .side-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 24px 12px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 4px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        /* LOGIN BUTTON LINKS */
        .btn-left {
            left: 20px;
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .btn-left:hover {
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.8);
            transform: translateY(-50%) scale(1.05);
        }

        /* RECHTE SEITENBUTTONS */
        .side-group-right {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .btn-right-1 {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .btn-right-2 {
            background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        /* 3. MODAL / OVERLAY LOGIN FORMULAR */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .portal-card {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            padding: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .portal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* TABS & FORMULAR */
        .portal-tabs {
            display: flex;
            background: #050b14;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--bth-blue-primary);
            color: #fff;
        }

        .portal-view {
            display: none;
        }

        .portal-view.active {
            display: block;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .partner-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .partner-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
        }

        .partner-card.active {
            border-color: var(--bth-cyan);
            background: rgba(2, 132, 199, 0.15);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--bth-cyan);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--bth-blue-primary);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- LINKER VERTIKALER LOGIN BUTTON -->
    <button class="side-btn btn-left" onclick="toggleModal(true)">LOGIN</button>

    <!-- RECHTE SEITENBUTTONS (OPTIONAL) -->
    <div class="side-group-right">
        <button class="side-btn btn-right-1">PARTNER</button>
        <button class="side-btn btn-right-2">INFO</button>
    </div>

    <!-- ZENTRALES MOTIV MIT GLOW -->
    <div class="hero-center">
        <img src="./bth.png" alt="BTH PLANWERK" class="hero-img" onerror="this.style.display='none'; document.getElementById('hero-text').style.display='block';">
        <div id="hero-text" class="hero-fallback" style="display: none;">BTH PLANWERK</div>
    </div>

    <!-- MODAL POPUP FOR FORMULAR -->
    <div id="login-modal" class="modal-overlay">
        <div class="portal-card">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            
            <div class="portal-tabs">
                <button id="tab-client" class="tab-btn active" onclick="switchTab('client')">Kunden-Zugang</button>
                <button id="tab-staff" class="tab-btn" onclick="switchTab('staff')">Mitarbeiter-Login</button>
            </div>

            <!-- KUNDEN ZUGANG -->
            <div id="view-client" class="portal-view active">
                <p class="instruction">Wählen Sie Ihren Partnerbetrieb:</p>
                
                <div class="partner-grid">
                    <div class="partner-card active" onclick="selectPartner(this, 'bth')">
                        <span>🌊</span>
                        <div>
                            <strong>BTH Hamburg</strong>
                        </div>
                    </div>

                    <div class="partner-card" onclick="selectPartner(this, 'gartenfit')">
                        <span>🌱</span>
                        <div>
                            <strong>Firma Gartenfit</strong>
                        </div>
                    </div>
                </div>

                <input type="hidden" id="selected-partner" value="bth">

                <div class="form-group">
                    <label>Ihr persönlicher Planungscode</label>
                    <input type="text" id="client-code" placeholder="z. B. BTH-8942-X" style="text-transform: uppercase;">
                </div>

                <button class="btn-primary" onclick="startClientSession()">Planung freischalten ➔</button>
            </div>

            <!-- MITARBEITER LOGIN -->
            <div id="view-staff" class="portal-view">
                <p class="instruction">Interner Zugang für Profi-Planung:</p>

                <div class="form-group">
                    <label>Benutzername / E-Mail</label>
                    <input type="text" id="staff-user" placeholder="mitarbeiter@bth.de">
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="staff-pass" placeholder="••••••••">
                </div>

                <button class="btn-primary" onclick="startStaffSession()">Profi-CAD Öffnen 🔐</button>
            </div>

        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('login-modal');
            if (show) {
                modal.classList.add('open');
            } else {
                modal.classList.remove('open');
            }
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.portal-view').forEach(view => view.classList.remove('active'));

            if (type === 'client') {
                document.getElementById('tab-client').classList.add('active');
                document.getElementById('view-client').classList.add('active');
            } else {
                document.getElementById('tab-staff').classList.add('active');
                document.getElementById('view-staff').classList.add('active');
            }
        }

        function selectPartner(cardElement, partnerId) {
            document.querySelectorAll('.partner-card').forEach(card => card.classList.remove('active'));
            cardElement.classList.add('active');
            document.getElementById('selected-partner').value = partnerId;
        }

        function startClientSession() {
            const partner = document.getElementById('selected-partner').value;
            const code = document.getElementById('client-code').value;
            window.location.href = `editor.html?mode=client&partner=${partner}&code=${code}`;
        }

        function startStaffSession() {
            window.location.href = `editor.html?mode=pro`;
        }
    </script>
</body>
</html>
